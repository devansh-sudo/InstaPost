{% extends "base.html" %}
{% block title %}Library{% endblock %}
{% block content %}
<div class="row" style="justify-content:space-between">
  <h1>Library</h1>
  <form method="get" class="row">
    <select name="status"><option value="">all statuses</option>
      {% for st in statuses %}<option {{ 'selected' if st == status }}>{{ st }}</option>{% endfor %}
    </select><button>Filter</button>
  </form>
</div>
<div class="card">
<table>
  <tr><th>Created</th><th>Format</th><th>Pillar</th><th>Status</th><th>Hook</th></tr>
  {% for i in items %}
  <tr><td class="muted">{{ i.created_at | local("%d %b %H:%M") }}</td><td>{{ i.format }}</td>
    <td>{{ i.pillar }}</td><td><span class="pill">{{ i.status }}</span></td>
    <td><a href="/items/{{ i.id }}">{{ i.hook[:70] }}</a></td></tr>
  {% else %}<tr><td colspan="5" class="muted">Nothing yet.</td></tr>{% endfor %}
</table>
</div>
{% endblock %}
