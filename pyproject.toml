[project]
name = "instapost"
version = "0.1.0"
description = "Self-hosted content agent for a Hindi spiritual page (Instagram, Facebook Reels, YouTube Shorts)"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0",
    "httpx>=0.27",
    "numpy>=2.0",
    "pillow>=11.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
]

[project.scripts]
instapost = "instapost.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6"]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
