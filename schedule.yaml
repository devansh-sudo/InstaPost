# Posting schedule. You decide HOW MUCH is posted (daily_plan, slots, limits); the weekly
# planner (Phase 4) decides WHAT each piece is. All times are local (timezone below).

timezone: Asia/Kolkata

# When the worker creates the next day's content and sends it to Telegram for approval.
generate_at: "20:30"

# When the daily report for the previous day is sent to Telegram.
report_at: "09:00"

# Weekly review + next week's plan (the plan can be edited on the dashboard's Plan page).
plan_day: sun
plan_at: "18:00"

# Sunday YouTube video from the week's published posts (6-9 minutes, chapters, thumbnail).
# Built at make_at and sent to you for approval; published to YouTube at publish_at.
weekly_video:
  enabled: true
  day: sun
  make_at: "16:30"
  publish_at: "19:15"
  days: 7

# Time slots per format. Items are scheduled into the next free slot after approval.
slots:
  reel_book_pov: ["07:15", "20:45"]
  carousel_shlok: ["13:15"]
  story_line: ["06:45", "12:30", "21:30"]

# How many pieces to create each weekday. Pillars below are only used when no weekly plan
# exists yet; normally the planner picks them.
daily_plan:
  mon: {reel_book_pov: 2, carousel_shlok: 0, story_line: 2}   # Somvar: Shiv focus
  tue: {reel_book_pov: 1, carousel_shlok: 1, story_line: 2}
  wed: {reel_book_pov: 1, carousel_shlok: 0, story_line: 2}
  thu: {reel_book_pov: 1, carousel_shlok: 1, story_line: 2}
  fri: {reel_book_pov: 1, carousel_shlok: 0, story_line: 2}
  sat: {reel_book_pov: 1, carousel_shlok: 1, story_line: 2}
  sun: {reel_book_pov: 1, carousel_shlok: 0, story_line: 2}

pillar_rotation:
  reel_book_pov: [jeevan_sutra, gita, shiv_dhyan, kabir, life_lesson]
  carousel_shlok: [gita, kabir, gita, shiv_dhyan]
  story_line: [life_lesson, jeevan_sutra]
monday_pillar: shiv_dhyan

# Where each format goes. Platforms without credentials are skipped automatically.
targets:
  reel_book_pov: [instagram, facebook, youtube]
  carousel_shlok: [instagram]
  story_line: [instagram]

# Safety limits per platform per day (new accounts: keep these low for the first weeks).
max_posts_per_day:
  instagram: 6
  facebook: 2
  youtube: 2
